<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="fav-neon-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF8A" />
      <stop offset="100%" stop-color="#B8FF5A" />
    </linearGradient>
    <linearGradient id="fav-cyan-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Plate -->
  <rect width="48" height="48" rx="12" fill="#08090A" stroke="#262B3B" stroke-width="1.5" />

  <!-- Outer Isometric Hexagon Skeleton (Cyan) -->
  <path
    d="M24 7L39 15.5V32.5L24 41L9 32.5V15.5L24 7Z"
    stroke="url(#fav-cyan-edge)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- Internal Dividing Coordinate Lines -->
  <path
    d="M24 7V24M39 15.5L24 24M9 15.5L24 24M24 24V41M24 24L39 32.5M24 24L9 32.5"
    stroke="#1E293B"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- Central Decision Prism Core (Glowing Neon Lime) -->
  <path
    d="M24 15L31.5 19.5V28.5L24 33L16.5 28.5V19.5L24 15Z"
    fill="#111318"
    stroke="url(#fav-neon-lime)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#fav-glow)"
  />

  <!-- Inner Split Axes -->
  <path
    d="M24 24L31.5 19.5M24 24L16.5 19.5M24 24V33"
    stroke="url(#fav-neon-lime)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Center Dot -->
  <circle cx="24" cy="24" r="2.5" fill="#B8FF5A" />
</svg>