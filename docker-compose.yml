services:
  mongo:
    image: mongo:8.0
    container_name: decision-os-mongo-rs
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          mongosh --port 27017 --quiet --eval
          "try { if (rs.status().ok === 1) { quit(0); } } catch(e) {}
           rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] });
           quit(0);"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

volumes:
  mongo-data:
    driver: local
